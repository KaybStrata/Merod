name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merod
          POSTGRES_PASSWORD: merod
          POSTGRES_DB: merod_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U merod" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Test-only values. Real secrets live in Vercel/Railway, never in the repo.
      DATABASE_URL: postgres://merod:merod@localhost:5432/merod_test
      TEST_DATABASE_URL: postgres://merod:merod@localhost:5432/merod_test
      MEROD_ENV: dev
      MEROD_DEMO_DATA: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Migrate + seed test database
        run: npm run db:setup
      - run: npm test
      - run: npm run security:check
      - name: Production build
        run: npm run build
